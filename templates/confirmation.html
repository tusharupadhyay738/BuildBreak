<!doctype html><html lang="en"><meta charset="utf-8"><title>Order confirmed ? BreakShop</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><main><h1>Order confirmed</h1><p>Order #{{ order.id }}</p><p>Thank you, {{ order.name }}.</p><p>Subtotal: {{ order.subtotal|money }}</p><p>Discount: {{ order.discount|money }}</p><p>Total: {{ order.total|money }}</p><p>Delivery address: {{ order.address }}</p><form method="post" action="/new-cart"><input type="hidden" name="token" value="{{ session.checkout_token }}"><button>Start a new order</button></form></main></html>
