<svg xmlns="http://www.w3.org/2000/svg" width="960" height="336" viewBox="0 0 960 336" role="img" aria-labelledby="title desc">
  <title id="title">BuildBreak Arena — a checkout repair</title>
  <desc id="desc">BreakShop's SAVE10 discount was $5.40 on a $44.97 cart. After one Codex repair, Kane verified the expected $4.50 using the same test.</desc>
  <defs>
    <clipPath id="frame"><rect width="960" height="336" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="960" height="336" fill="#0f172a"/>
    <rect x="356" width="604" height="336" fill="#f8fafc"/>
    <rect x="356" y="0" width="604" height="5" fill="#047857"/>
    <!-- The product name and the three participants occupy the dark console rail. -->
    <g transform="translate(29 28)" fill="none" stroke="#a7f3d0" stroke-width="3.5" stroke-linejoin="round">
      <path d="M0 12 12 0l12 12-12 12Z M18 12 30 0l12 12-12 12Z"/>
    </g>
    <text x="27" y="128" fill="#ffffff" font-size="55" font-weight="700" letter-spacing="-3">BuildBreak</text>
    <text x="26" y="185" fill="#a7f3d0" font-size="66" font-weight="700" letter-spacing="-3">Arena</text>
    <path d="M29 224h298" stroke="#334155"/>
    <g fill="#e2e8f0" font-size="17">
      <text x="29" y="258">Gemini plants the bug.</text>
      <text x="29" y="286">Codex repairs it. Kane checks both.</text>
    </g>
    <!-- Editorial rendering of a documented result, not a dashboard screenshot. -->
    <text x="388" y="47" fill="#475569" font-family="Consolas, monospace" font-size="15" letter-spacing="1.6">BREAKSHOP / SAVE10</text>
    <text x="386" y="91" fill="#0f172a" font-size="34" font-weight="700" letter-spacing="-1">Kane caught the wrong discount.</text>
    <text x="388" y="120" fill="#475569" font-size="18">10% off a $44.97 cart should save $4.50.</text>
    <g transform="translate(385 146)">
      <rect width="244" height="96" rx="9" fill="#fff1f2" stroke="#fecdd3"/>
      <circle cx="21" cy="24" r="8" fill="#be123c"/>
      <path d="m18 21 6 6m0-6-6 6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
      <text x="38" y="30" fill="#9f1239" font-size="17" font-weight="600">Before repair</text>
      <text x="15" y="79" fill="#881337" font-size="44" font-weight="700" letter-spacing="-1.5">$5.40</text>
    </g>
    <path d="M640 194h22m-7-7 7 7-7 7" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(675 146)">
      <rect width="251" height="96" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
      <circle cx="21" cy="24" r="8" fill="#047857"/>
      <path d="m17.5 24 2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="30" fill="#065f46" font-size="17" font-weight="600">After repair</text>
      <text x="15" y="79" fill="#064e3b" font-size="44" font-weight="700" letter-spacing="-1.5">$4.50</text>
    </g>
    <path d="M386 265h540" stroke="#cbd5e1"/>
    <text x="387" y="294" fill="#0f172a" font-size="18" font-weight="600">One repair attempt. Same browser test.</text>
    <text x="388" y="317" fill="#475569" font-size="15">Recorded November 18, 2026</text>
  </g>
</svg>
